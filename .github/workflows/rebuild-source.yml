name: Rebuild and validate NXN source

on:
  workflow_dispatch:
  push:
    branches: [nxn-source-backup]
    paths:
      - 'source_chunks/**'
      - '.github/workflows/rebuild-source.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nxn-source-backup

      - name: Rebuild original ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat source_chunks/chunk_*.b64 | base64 -d > /tmp/nxn-source.zip
          rm -rf /tmp/nxn-extract
          mkdir -p /tmp/nxn-extract
          # The backup archive has a harmless leading-offset warning. Extract files anyway,
          # then validate every required source file below instead of failing on unzip code 2.
          unzip -o /tmp/nxn-source.zip -d /tmp/nxn-extract || true
          cp -a /tmp/nxn-extract/. ./

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          test -s app.py
          test -s static/app.js
          test -s static/style.css
          test -s templates/login.html
          test -s templates/index.html
          test -s requirements.txt
          python -m py_compile app.py
          python - <<'PY'
          import ast, pathlib
          p = pathlib.Path('app.py')
          ast.parse(p.read_text(encoding='utf-8'))
          print('Python syntax: OK')
          for f in ['static/app.js','static/style.css','templates/login.html','templates/index.html']:
              q=pathlib.Path(f)
              print(f, q.stat().st_size, 'bytes')
          PY

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt README.md static templates
          if git diff --cached --quiet; then
            echo "Validated source already matches repository"
          else
            git commit -m "Rebuild validated NXN source from archive"
            git push origin nxn-source-backup
          fi
