name: Rebuild NXN source

on:
  workflow_dispatch:
  push:
    branches:
      - nxn-source-backup
    paths:
      - 'rebuild_chunks/**'
      - '.github/workflows/rebuild-source.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nxn-source-backup
      - name: Rebuild source files from chunks
        shell: bash
        run: |
          set -euo pipefail
          rebuild_file() {
            local dir="$1"
            local out="$2"
            [ -d "$dir" ] || return 0
            mkdir -p "$(dirname "$out")"
            : > "$out"
            for f in "$dir"/chunk_*.b64; do
              [ -e "$f" ] || continue
              base64 -d "$f" >> "$out"
            done
          }
          rebuild_file rebuild_chunks/app app.py
          rebuild_file rebuild_chunks/app_js static/app.js
          rebuild_file rebuild_chunks/style_css static/style.css
          python -m py_compile app.py
          test -s static/app.js
          test -s static/style.css
      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/app.js static/style.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Reconstruct NXN runtime source"
            git push origin nxn-source-backup
          fi
