name: Rebuild NXN source

on:
  workflow_dispatch:
  push:
    branches:
      - nxn-source-backup
    paths:
      - 'source_chunks/**'
      - '.github/workflows/rebuild-source.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nxn-source-backup
      - name: Rebuild source ZIP
        run: |
          cat source_chunks/chunk_*.b64 | tr -d '\n' | base64 -d > nxn_source.zip
          unzip -o nxn_source.zip
          rm -f nxn_source.zip
      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt README.md static templates
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Reconstruct NXN source from backup chunks"
            git push origin nxn-source-backup
          fi
