name: Validate NXN Production Source
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required files
        run: |
          test -s app.py
          test -s api/index.py
          test -s templates/login.html
          test -s templates/index.html
          test -s static/app.js
          test -s static/style.css
          test -s vercel.json
      - name: Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile api/index.py
      - name: Database and import smoke test
        env:
          NXN_DB_PATH: /tmp/nxn-ci.db
        run: |
          python - <<'PY'
          import os, sqlite3
          os.environ['NXN_DB_PATH']='/tmp/nxn-ci.db'
          import app
          app.init_db()
          with app.conn() as c:
              assert c.execute('select count(*) from branches').fetchone()[0] >= 1
              assert c.execute('select count(*) from users').fetchone()[0] >= 1
              assert c.execute('select count(*) from audit_sections').fetchone()[0] >= 1
              assert c.execute('select count(*) from audit_questions').fetchone()[0] >= 1
          import api.index as entry
          assert entry.handler is app.H
          print('NXN production source smoke test: OK')
          PY
